[project]
name = "justrunme-airlock"
version = "0.1.0"
description = "Verified execution firewall for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
keywords = [
    "ai-agents",
    "agent-security",
    "sandbox",
    "gvisor",
    "policy-engine",
    "fail-closed",
    "prompt-injection",
]
authors = [
    {name = "Andrey Lesnikov"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.1",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    # 0.3.0 rejects some RFC 8785 edge integers that the JS verifier and vectors still cover
    "jcs>=0.2.1,<0.3",
]

[project.urls]
Homepage = "https://justrunme.com/hackathons/#airlock"
Repository = "https://github.com/justrunme/airlock"
Issues = "https://github.com/justrunme/airlock/issues"
Documentation = "https://github.com/justrunme/airlock#readme"
"Live demo" = "https://huggingface.co/spaces/justrunme/airlock"
Research = "https://justrunme.com/research/fail-closed-authorization-ai-agents/"
Preprint = "https://doi.org/10.5281/zenodo.24075886"
Book = "https://justrunme.com/book/"
Author = "https://justrunme.com/"
ORCID = "https://orcid.org/0009-0004-7583-4314"

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.17,<0.18",
]

[project.scripts]
airlock = "airlock.cli:main"
airlock-web = "airlock.web.app:main"

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.setuptools.package-data]
"airlock.web" = ["static/*", "static/vendor/*", "samples/*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "docker: tests that require Docker",
    "smoke: smoke tests that require live services",
]

[project]
name = "airlock"
version = "0.1.0"
description = "Verified execution firewall for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Andrey Lesnikov", email = "52860508+justrunme@users.noreply.github.com"}
]
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.1",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "jcs>=0.2.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.17,<0.18",
]

[project.scripts]
airlock = "airlock.cli:main"
airlock-web = "airlock.web.app:main"

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.setuptools.package-data]
"airlock.web" = ["static/*", "static/vendor/*", "samples/*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "docker: tests that require Docker",
    "smoke: smoke tests that require live services",
]

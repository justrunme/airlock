name: CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check airlock tests scripts
        ruff format --check airlock tests scripts

    - name: Check docs/CHECKS.md matches the test collection
      run: python scripts/gen_checks.py --check

    - name: Check the published corpus metrics are current
      run: python scripts/corpus_metrics.py --check

    - name: Check JS syntax
      run: |
        for f in airlock/web/static/*.js tests/js/*.mjs; do node --check "$f"; done

  node:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Run receipt verifier tests
      run: node --test tests/js/*.test.mjs

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run full test suite on runc
      run: |
        docker info --format 'runtimes: {{json .Runtimes}}'
        echo "Container runtime: $AIRLOCK_RUNTIME (pinned; GitHub runners have no gVisor)" | tee -a "$GITHUB_STEP_SUMMARY"
        pytest tests/ -v --tb=short -rs
      env:
        # Pin the runtime so the job never falls back silently.
        AIRLOCK_RUNTIME: runc
        VULTR_INFERENCE_API_KEY: ${{ secrets.VULTR_INFERENCE_API_KEY }}
